name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.6', '3.3'] # Tender and Lighthouse run 2.6
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      # in the official image, run by hand (the same way for every version)
      - run: >
          docker run --rm --network host -v "$PWD":/splam -w /splam ruby:${{ matrix.ruby }}
          sh -c 'bundle install --jobs 4 && bundle exec rake test'
